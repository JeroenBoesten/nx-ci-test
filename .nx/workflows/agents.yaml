launch-templates:
  linux-medium-js-cypress:
    resource-class: 'docker_linux_amd64/medium'
    image: 'ubuntu22.04-node20.19-v2'
    env:
      DISPLAY: ':99'
    init-steps:
      - name: Checkout
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml'
      - name: Restore Node Modules Cache
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
        inputs:
          key: 'package-lock.json|yarn.lock|pnpm-lock.yaml|patches/**|.yarn/patches/**'
          paths: 'node_modules'
          base-branch: 'main'
      - name: Restore Browser Binary Cache
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
        inputs:
          key: 'package-lock.json|yarn.lock|pnpm-lock.yaml|"browsers"'
          paths: |
            '../.cache/Cypress'
          base-branch: 'main'
      - name: Install Node
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-node/main.yaml'
      - name: Install Node Modules
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-node-modules/main.yaml'
      - name: Install Cypress system dependencies and Xvfb
        # Cypress runs the Electron browser by default and requires an X server
        # on Linux. See https://docs.cypress.io/app/continuous-integration/overview#Xvfb
        script: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk2.0-0 \
            libgtk-3-0 \
            libgbm-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libasound2 \
            libxtst6 \
            xauth \
            xvfb
      - name: Install Browsers (if needed)
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-browsers/main.yaml'
      - name: Start Xvfb
        # Use a 24-bit color depth so Electron / Chrome don't crash on 8-bit default.
        # See https://docs.cypress.io/app/continuous-integration/overview#Xvfb
        script: |
          Xvfb -screen 0 1280x1024x24 :99 &
          # Give Xvfb a moment to come up before tasks start.
          sleep 1
